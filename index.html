<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChitPix</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;padding-bottom:70px}
.top{padding:12px 15px;display:flex;justify-content:space-between;border-bottom:1px solid #222;font-size:22px;font-weight:bold}
.stories{display:flex;gap:14px;padding:12px;overflow:auto}
.s{text-align:center;font-size:11px} .s div{width:60px;height:60px;border-radius:50%;border:3px solid #ff2a6d;background:#333}
.post{border-bottom:8px solid #111} .post img,.post video{width:100%}
.bar{display:flex;gap:15px;padding:10px;font-size:22px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #333;display:flex;justify-content:space-around;padding:10px 0}
.nav div{text-align:center;font-size:20px} .search{padding:10px} .search input{width:94%;padding:10px;border-radius:10px;border:none;background:#222;color:#fff}
</style>
</head>
<body>
<div class="top"><span>📸 ChitPix</span><span>❤️ ✉️</span></div>
<div class="search"><input placeholder="🔍 Search"></div>
<div class="stories"><div class="s"><div></div>Your story</div><div class="s"><div></div>@maya</div><div class="s"><div></div>@karan</div><div class="s"><div></div>@lina</div></div>
<div class="post">
<div style="padding:8px">👤 @alex_hikes • 2h</div>
<img src="https://picsum.photos/600/600?random=1">
<div class="bar"><span onclick="this.innerText=this.innerText=='🤍'?'❤️':'🤍'">🤍</span><span>💬</span><span>✈️ Share</span><span style="margin-left:auto">🔖 Save</span></div>
<p style="padding:0 10px"><b>2341 likes</b><br>Sunset hike ❤️ #yosemite</p>
</div>
<div class="post">
<div style="padding:8px">🎬 @reels • Reels</div>
<video controls autoplay muted loop><source src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
<div class="bar"><span onclick="this.innerText=this.innerText=='🤍'?'❤️':'🤍'">🤍</span><span>💬</span><span>✈️ Share</span><span style="margin-left:auto">👤 Profile</span></div>
</div>
<div class="nav">
<div>🏠<br><small>Home</small></div>
<div>🔍<br><small>Search</small></div>
<div>🎬<br><small>Reels</small></div>
<div>❤️<br><small>Like</small></div>
<div>👤<br><small>Profile</small></div>
</div>
</body>
  </html>
